<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آرایشگاه سید | Seyed Barber</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
        }

        body {
            background: #0a0a0a;
            background-image: radial-gradient(circle at top, #1f1a08 0%, #050505 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.1);
        }

        .avatar-box {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a2a2a, #151515);
            border: 2px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4af37;
            font-size: 42px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #d4af37;
            color: #000;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        h1 {
            color: #f3e5ab;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .bio {
            color: #8a8a8a;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 30, 30, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.25);
            padding: 15px 18px;
            border-radius: 16px;
            color: #f0f0f0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn i.icon {
            font-size: 18px;
            color: #d4af37;
            width: 24px;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.98);
            background: #d4af37;
            color: #000;
        }

        .btn:active i.icon {
            color: #000;
        }

        .arrow {
            font-size: 11px;
            color: #666;
        }

        .footer-text {
            margin-top: 30px;
            font-size: 11px;
            color: #555;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-box">
            <div class="avatar">
                <i class="fa-solid fa-scissors"></i>
            </div>
            <div class="badge">
                <i class="fa-solid fa-check"></i>
            </div>
        </div>

        <h1>آرایشگاه سید</h1>
        <p class="bio">Barber Seyed62 | استایل و اصلاح تخصصی</p>

        <div class="btn-list">
            <a href="tel:09150000000" class="btn">
                <div class="btn-left">
                    <i class="fa-solid fa-phone icon"></i>
                    <span>تماس مستقیم</span>
                </div>
                <i class="fa-solid fa-chevron-left arrow"></i>
            </a>

            <a href="https://instagram.com" target="_blank" class="btn">
                <div class="btn-left">
                    <i class="fa-brands fa-instagram icon"></i>
                    <span>پیج اینستاگرام</span>
                </div>
                <i class="fa-solid fa-chevron-left arrow"></i>
            </a>

            <a href="https://wa.me/989150000000" target="_blank" class="btn">
                <div class="btn-left">
                    <i class="fa-brands fa-whatsapp icon"></i>
                    <span>پیام در واتساپ</span>
                </div>
                <i class="fa-solid fa-chevron-left arrow"></i>
            </a>

            <a href="https://neshan.org" target="_blank" class="btn">
                <div class="btn-left">
                    <i class="fa-solid fa-location-dot icon"></i>
                    <span>مسیریابی آدرس</span>
                </div>
                <i class="fa-solid fa-chevron-left arrow"></i>
            </a>
        </div>

        <div class="footer-text">
            TOUCH TO CONNECT • NFC CARD
        </div>
    </div>

</body>
</html>
