<!DOCTYPE html>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 24px; padding: 35px 25px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); }
        .avatar { width: 130px; height: 130px; border-radius: 50%; margin: 0 auto 15px; object-fit: cover; border: 3px solid rgba(255, 255, 255, 0.4); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        h1 { color: #ffffff; font-size: 24px; margin-bottom: 5px; }
        p { color: #cccccc; font-size: 14px; margin-bottom: 25px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 15px; transition: 0.3s; }
        .btn-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; }
        .btn-green { background: #25d366; color: #000000; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
        .btn:hover { transform: translateY(-3px); opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">

        <a href="https://instagram.com/Mohammad.ghorbani_org2625" class="btn btn-insta" target="_blank">

        </a>
        
        <a href="tel:09028390846" class="btn btn-green">
            <i class="fa-solid fa-phone" style="font-size: 18px;"></i> تماس مستقیم
        </a>
        
        <a href="https://wa.me/989028390846" class="btn btn-green" target="_blank">
            <i class="fa-brands fa-whatsapp" style="font-size: 20px;"></i> واتساپ

</body>
