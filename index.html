<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرشین فیلم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        
        body {
            background-color: #0f172a;
            background-image: url('https://raw.githubusercontent.com/mohammadghorbanoorg-cell/card-/main/1786891565124.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 35px;
            padding: 40px 25px;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.5);
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        h1 { color: #ffffff; font-size: 25px; margin-bottom: 6px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        p { color: #e0e0e0; font-size: 14px; margin-bottom: 30px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 18px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .btn-content { display: flex; flex-direction: column; align-items: center; flex-grow: 1; }
        .btn-title { font-size: 15px; }
        .btn-sub { font-size: 11px; opacity: 0.9; margin-top: 2px; direction: ltr; }
        .btn i { font-size: 22px; }

        .btn-telegram { background: linear-gradient(135deg, #229ED9, #0088cc); color: #ffffff; }
        .btn-phone { background: linear-gradient(135deg, #00e676, #00c853); color: #000000; }
    </style>
</head>
<body>

    <div class="glass-card">
        <img src="https://raw.githubusercontent.com/mohammadghorbanoorg-cell/card-/main/1786891565124.png" alt="پرشین فیلم" class="profile-img">
        
        <h1>پرشین فیلم</h1>
        <p>کانال و راه ارتباطی رسمی</p>
        
        <!-- دکمه تلگرام همراه با لینک مستقیم اپلیکیشن -->
        <a href="tg://resolve?domain=farjafarin" onclick="openChannel(event)" class="btn btn-telegram">
            <i class="fa-brands fa-telegram"></i>
            <div class="btn-content">
                <span class="btn-title">ورود به کانال تلگرام</span>
                <span class="btn-sub">@farjafarin</span>
            </div>
        </a>
        
        <a href="tel:+989157692124" class="btn btn-phone">
            <i class="fa-solid fa-phone"></i>
            <div class="btn-content">
                <span class="btn-title">تماس مستقیم</span>
                <span class="btn-sub">09157692124</span>
            </div>
        </a>
    </div>

    <script>
        function openChannel(e) {
            e.preventDefault();
            // تلاش برای باز کردن مستقیم اپلیکیشن تلگرام
            window.location.href = "tg://resolve?domain=farjafarin";
            
            // پشتیبان: اگر اپلیکیشن واکنش نداد، بعد از نیم ثانیه لینک وب باز شود
            setTimeout(function() {
                window.location.href = "https://t.me/farjafarin";
            }, 500);
        }
    </script>

</body>
</html>
