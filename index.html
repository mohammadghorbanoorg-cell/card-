<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد قربانی | کارت ویزیت دیجیتال</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, 'Segoe UI', sans-serif; }
        
        body {
            /* عکس تمام‌صفحه به همراه تیره کردن ملایم پس‌زمینه */
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.5)), url('profile.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background-color: #0b0f19;
        }

        /* کارت شیشه‌ای تمام صفحه */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(10, 15, 25, 0.45);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            padding: 40px 20px;
            width: 100%;
            max-width: 480px;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 20px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
        }

        h1 { color: #ffffff; font-size: 28px; font-weight: bold; margin-bottom: 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        p { color: #e0e0e0; font-size: 15px; margin-bottom: 35px; text-shadow: 0 1px 5px rgba(0,0,0,0.5); }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 380px;
            padding: 16px 20px;
            margin-bottom: 18px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            transition: transform 0.2s ease;
        }

        .btn-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        .btn-title { font-size: 17px; font-weight: bold; }
        .btn-sub { font-size: 13px; opacity: 0.95; margin-top: 3px; direction: ltr; }

        .btn-insta {
            background: linear-gradient(90deg, #e6683c, #dc2743, #bc1888);
            box-shadow: 0 6px 20px rgba(220, 39, 67, 0.35);
        }

        .btn-phone {
            background: linear-gradient(90deg, #00e676, #00c853);
            color: #000;
            box-shadow: 0 6px 20px rgba(0, 230, 118, 0.35);
        }

        .btn-whatsapp {
            background: linear-gradient(90deg, #29b6f6, #0288d1);
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(2, 136, 209, 0.35);
        }

        .btn i { font-size: 26px; }
        .btn:hover { transform: scale(1.02); }
    </style>
</head>
<body>

    <div class="card">
        <img src="profile.jpg" alt="محمد قربانی" class="avatar">
        <h1>محمد قربانی</h1>
        <p>مدیریت و بازرگانی</p>
        
        <a href="https://instagram.com/Mohammad.ghorbani_org2625" class="btn btn-insta" target="_blank">
            <i class="fa-brands fa-instagram"></i>
            <div class="btn-content">
                <span class="btn-title">اینستاگرام</span>
                <span class="btn-sub">@Mohammad.ghorbani_org2625</span>
            </div>
        </a>
        
        <a href="tel:09028390846" class="btn btn-phone">
            <i class="fa-solid fa-phone"></i>
            <div class="btn-content">
                <span class="btn-title">تماس مستقیم</span>
                <span class="btn-sub">09028390846</span>
            </div>
        </a>
        
        <a href="https://wa.me/989028390846" class="btn btn-whatsapp" target="_blank">
            <i class="fa-brands fa-whatsapp"></i>
            <div class="btn-content">
                <span class="btn-title">واتساپ</span>
                <span class="btn-sub">09028390846</span>
            </div>
        </a>
    </div>

</body>
</html>
