<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد قربانی | کارت ویزیت دیجیتال</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 30px 20px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            color: #ffffff;
        }

        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .name {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .title {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 28px;
            font-weight: 400;
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            font-weight: 700;
            font-size: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            box-shadow: 0 8px 20px rgba(220, 39, 67, 0.3);
        }

        .btn-call {
            background: linear-gradient(45deg, #00b09b, #96c93d);
            box-shadow: 0 8px 20px rgba(0, 176, 155, 0.3);
        }

        .btn-whatsapp {
            background: linear-gradient(45deg, #128c7e, #25d366);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
        }

        .btn i {
            font-size: 20px;
        }

        .btn-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.2;
        }

        .btn-subtitle {
            font-size: 11px;
            font-weight: 400;
            opacity: 0.9;
            margin-top: 2px;
            direction: ltr;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-container">
            <!-- لینک عکس خودتان را در src قرار دهید -->
            <img class="avatar" src="https://via.placeholder.com/150" alt="محمد قربانی">
        </div>

        <h1 class="name">محمد قربانی</h1>
        <p class="title">مدیریت و بازرگانی</p>

        <div class="btn-list">
            <!-- اینستاگرام -->
            <a href="https://instagram.com/Mohammad_ghorbani_org2625" class="btn btn-instagram" target="_blank">
                <i class="fa-brands fa-instagram"></i>
                <div class="btn-text">
                    <span>اینستاگرام</span>
                    <span class="btn-subtitle">@Mohammad_ghorbani_org2625</span>
                </div>
            </a>

            <!-- تماس مستقیم -->
            <a href="tel:09028390846" class="btn btn-call">
                <i class="fa-solid fa-phone"></i>
                <div class="btn-text">
                    <span>تماس مستقیم</span>
                    <span class="btn-subtitle">09028390846</span>
                </div>
            </a>

            <!-- واتس‌اپ -->
            <a href="https://wa.me/989028390846" class="btn btn-whatsapp" target="_blank">
                <i class="fa-brands fa-whatsapp"></i>
                <div class="btn-text">
                    <span>واتس‌اپ</span>
                    <span class="btn-subtitle">09028390846</span>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
