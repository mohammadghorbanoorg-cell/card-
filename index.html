<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محمد قربانی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        
        body {
            background-color: #1a1a1a; /* رنگ پس‌زمینه تیره */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* کارت شیشه‌ای مرکزی */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            padding: 40px 25px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* عکس پروفایل دایره‌ای */
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.3);
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        h1 { color: #fff; font-size: 28px; margin-bottom: 5px; }
        p { color: #ccc; font-size: 16px; margin-bottom: 30px; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 15px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        .btn-content { display: flex; flex-direction: column; align-items: center; flex-grow: 1; }
        .btn-title { font-size: 16px; }
        .btn-sub { font-size: 12px; opacity: 0.8; margin-top: 2px; direction: ltr; }
        .btn i { font-size: 24px; }

        .btn-insta { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
        .btn-phone { background: linear-gradient(135deg, #00e676, #00c853); color: #000; }
        .btn-whatsapp { background: linear-gradient(135deg, #29b6f6, #0288d1); }
    </style>
</head>
<body>

    <div class="glass-card">
        <!-- عکس شما که در گیت‌هاب آپلود کردید -->
        <img src="background.png" alt="محمد قربانی" class="profile-img">
        
        <h1>محمد قربانی</h1>
        <p>مدیریت و بازرگانی</p>
        
        <a href="https://instagram.com/Mohammad.ghorbani_org2625" class="btn btn-insta" target="_blank">
            <i class="fa-brands fa-instagram"></i>
            <div class="btn-content">
                <span class="btn-title">اینستاگرام</span>
                <span class="btn-sub">@Mohammad.ghorbani_org2625</span>
            </div>
        </a>
        
        <a href="tel:09028390846" class="btn btn-phone">
            <i class="fa-solid fa-phone"></i>
            <div class="btn-content">
                <span class="btn-title">تماس مستقیم</span>
                <span class="btn-sub">09028390846</span>
            </div>
        </a>
        
        <a href="https://wa.me/989028390846" class="btn btn-whatsapp" target="_blank">
            <i class="fa-brands fa-whatsapp"></i>
            <div class="btn-content">
                <span class="btn-title">واتساپ</span>
                <span class="btn-sub">09028390846</span>
            </div>
        </a>
    </div>

</body>
</html>
