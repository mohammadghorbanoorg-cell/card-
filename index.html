<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد قربانی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        
        /* پس‌زمینه تیره و مدرن */
        body { 
            background-color: #0f0f0f; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            background-image: radial-gradient(circle at 50% 50%, #202020 0%, #0f0f0f 100%);
        }

        /* کارت شیشه‌ای مشابه تصویر */
        .glass-card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 35px; 
            padding: 40px 25px; 
            width: 100%; 
            max-width: 380px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .profile-img { 
            width: 130px; 
            height: 130px; 
            border-radius: 50%; 
            border: 4px solid rgba(255, 255, 255, 0.15); 
            object-fit: cover; 
            margin-bottom: 20px; 
        }

        h1 { color: #fff; font-size: 24px; margin-bottom: 5px; font-weight: bold; }
        p { color: #aaa; font-size: 14px; margin-bottom: 30px; }

        .btn { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            width: 100%; 
            padding: 14px 20px; 
            margin-bottom: 14px; 
            border-radius: 18px; 
            text-decoration: none; 
            color: white; 
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        .btn:hover { background: rgba(255, 255, 255, 0.15); }

        .btn-content { display: flex; flex-direction: column; align-items: center; flex-grow: 1; }
        .btn-title { font-size: 15px; }
        .btn-sub { font-size: 10px; opacity: 0.7; margin-top: 3px; direction: ltr; }
        .btn i { font-size: 20px; margin-left: 10px; }

        /* رنگ دکمه‌ها مشابه تصویر */
        .btn-insta { border-right: 5px solid #fd1d1d; }
        .btn-phone { border-right: 5px solid #00e676; }
        .btn-whatsapp { border-right: 5px solid #29b6f6; }
    </style>
</head>
<body>
    <div class="glass-card">
        <img src="background.png" alt="محمد قربانی" class="profile-img">
        
        <h1>محمد قربانی</h1>
        <p>مدیریت و بازرگانی</p>

        <a href="https://instagram.com/Mohammad.ghorbani_org2625" class="btn btn-insta" target="_blank">
            <div class="btn-content">
                <span class="btn-title">اینستاگرام</span>
                <span class="btn-sub">@Mohammad.ghorbani_org2625</span>
            </div>
            <i class="fa-brands fa-instagram"></i>
        </a>

        <a href="tel:09028390846" class="btn btn-phone">
            <div class="btn-content">
                <span class="btn-title">تماس مستقیم</span>
                <span class="btn-sub">09028390846</span>
            </div>
            <i class="fa-solid fa-phone"></i>
        </a>

        <a href="https://wa.me/989028390846" class="btn btn-whatsapp">
            <div class="btn-content">
                <span class="btn-title">واتساپ</span>
                <span class="btn-sub">09028390846</span>
            </div>
            <i class="fa-brands fa-whatsapp"></i>
        </a>
    </div>
</body>
</html>
