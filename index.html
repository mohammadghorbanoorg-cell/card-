<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد قربانی | کارت ویزیت دیجیتال</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        
        body {
            background-image: url('profile.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #111;
        }

        .card {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px 25px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        h1 { color: #ffffff; font-size: 26px; margin-bottom: 6px; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
        p { color: #dddddd; font-size: 15px; margin-bottom: 30px; }

        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 14px; text-decoration: none; font-weight: bold; font-size: 15px; transition: 0.3s; }
        
        .btn-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; }
        .btn-green { background: #25d366; color: #000000; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3); }
        
        .btn:hover { transform: translateY(-2px); opacity: 0.95; }
    </style>
</head>
<body>
    <div class="card">
        <h1>محمد قربانی</h1>
        <p>مدیریت و بازرگانی</p>
        
        <a href="https://instagram.com/Mohammad.ghorbani_org2625" class="btn btn-insta" target="_blank">
            <i class="fa-brands fa-instagram" style="font-size: 18px;"></i> اینستاگرام
        </a>
        
        <a href="tel:09028390846" class="btn btn-green">
            <i class="fa-solid fa-phone" style="font-size: 18px;"></i> تماس مستقیم
        </a>
        
        <a href="mailto:example@email.com" class="btn btn-green">
            <i class="fa-solid fa-envelope" style="font-size: 18px;"></i> انتقادات و پیشنهادات
        </a>
    </div>
</body>
</html>
