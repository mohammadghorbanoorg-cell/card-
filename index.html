<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد قربانی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        
        body {
            /* عکس تمام صفحه */
            background-image: url('https://i.postimg.cc/85zK23r1/Screenshot-20260731-150216-Google-2.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .card {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            padding: 30px 20px;
            width: 100%;
            max-width: 420px;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 { color: #fff; font-size: 28px; margin-bottom: 8px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
        p { color: #ddd; font-size: 15px; margin-bottom: 30px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 16px;
            border-radius: 18px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        .btn-content { display: flex; flex-direction: column; align-items: center; flex-grow: 1; }
        .btn-title { font-size: 16px; }
        .btn-sub { font-size: 12px; opacity: 0.9; margin-top: 2px; direction: ltr; }

        .btn-insta { background: linear-gradient(90deg, #e6683c, #dc2743, #bc1888); }
        .btn-phone { background: linear-gradient(90deg, #00e676, #00c853); color: #000; }
        .btn-whatsapp { background: linear-gradient(90deg, #29b6f6, #0288d1); }
        .btn i { font-size: 24px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>محمد قربانی</h1>
        <p>مدیریت و بازرگانی</p>
        
        <a href="https://instagram.com/Mohammad.ghorbani_org2625" class="btn btn-insta" target="_blank">
            <i class="fa-brands fa-instagram"></i>
            <div class="btn-content">
                <span class="btn-title">اینستاگرام</span>
                <span class="btn-sub">@Mohammad.ghorbani_org2625</span>
            </div>
        </a>
        
        <a href="tel:09028390846" class="btn btn-phone">
            <i class="fa-solid fa-phone"></i>
            <div class="btn-content">
                <span class="btn-title">تماس مستقیم</span>
                <span class="btn-sub">09028390846</span>
            </div>
        </a>
        
        <a href="https://wa.me/989028390846" class="btn btn-whatsapp" target="_blank">
            <i class="fa-brands fa-whatsapp"></i>
            <div class="btn-content">
                <span class="btn-title">واتساپ</span>
                <span class="btn-sub">09028390846</span>
            </div>
        </a>
    </div>

</body>
</html>
