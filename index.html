<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammad Ghorbani</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background: #0f0f11; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1a1a1e; width: 100%; max-width: 380px; padding: 30px 20px; border-radius: 20px; text-align: center; border: 1px solid #2a2a30; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .avatar { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; }
        h1 { font-size: 1.2rem; margin-bottom: 5px; color: #fff; }
        p { font-size: 0.85rem; color: #888; margin-bottom: 25px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 0.95rem; transition: 0.3s; }
        .btn-insta { background: linear-gradient(45deg, #405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d); color: #fff; }
        .btn-call { background: #222; color: #25d366; border: 1px solid #25d366; }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">M</div>
        <h1>محمد قربانی</h1>
        <p>Mohammad.ghorbani_org2625</p>
        
        <a href="https://www.instagram.com/Mohammad.ghorbani_org2625" class="btn btn-insta">
            صفحه اینستاگرام
        </a>
        
        <a href="tel:09028390846" class="btn btn-call">
            تماس مستقیم (۰۹۰۲۸۳۹۰۸۴۶)
        </a>
    </div>
</body>
</html>
