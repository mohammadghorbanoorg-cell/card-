<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد قربانی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body {
            background-image: url('profile.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #333;
        }
        .overlay {
            background: rgba(0, 0, 0, 0.6);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 40px 30px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            z-index: 1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #fff; margin-bottom: 10px; }
        p { color: #eee; margin-bottom: 30px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; text-decoration: none; font-weight: bold; color: white; transition: 0.3s; }
        .btn-insta { background: linear-gradient(45deg, #f09433, #bc1888); }
        .btn-green { background: #25d366; color: black; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="card">
        <h1>محمد قربانی</h1>
        <p>مدیریت و بازرگانی</p>
        <a href="https://instagram.com/Mohammad.ghorbani_org2625" class="btn btn-insta" target="_blank"><i class="fa-brands fa-instagram"></i> اینستاگرام</a>
        <a href="tel:09028390846" class="btn btn-green"><i class="fa-solid fa-phone"></i> تماس مستقیم</a>
        <a href="https://wa.me/989028390846" class="btn btn-green"><i class="fa-solid fa-envelope"></i> انتقادات و پیشنهادات</a>
    </div>
</body>
</html>
