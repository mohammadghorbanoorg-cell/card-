<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد قربانی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        
        body {
            /* استفاده از آدرس مستقیم فایل در گیت‌هاب */
            background-image: url('https://raw.githubusercontent.com/mohammadghorbanoorg-cell/card-/main/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .glass-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 40px 25px;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.2);
            object-fit: cover;
            margin-bottom: 20px;
        }

        h1 { color: #fff; font-size: 24px; margin-bottom: 5px; }
        p { color: #ddd; font-size: 14px; margin-bottom: 30px; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-content { display: flex; flex-direction: column; align-items: center; flex-grow: 1; }
        .btn-title { font-size: 15px; }
        .btn-sub { font-size: 11px; opacity: 0.8; margin-top: 2px; direction: ltr; }
        .btn i { font-size: 20px; }
    </style>
</head>
<body>

    <div class="glass-card">
        <!-- استفاده از آدرس مستقیم برای عکس پروفایل -->
        <img src="https://raw.githubusercontent.com/mohammadghorbanoorg-cell/card-/main/background.png" alt="محمد قربانی" class="profile-img">
        
        <h1>محمد قربانی</h1>
        <p>مدیریت و بازرگانی</p>
        
        <a href="https://instagram.com/Mohammad.ghorbani_org2625" class="btn">
            <i class="fa-brands fa-instagram"></i>
            <div class="btn-content">
                <span class="btn-title">اینستاگرام</span>
                <span class="btn-sub">@Mohammad.ghorbani_org2625</span>
            </div>
        </a>
        
        <a href="tel:09028390846" class="btn">
            <i class="fa-solid fa-phone"></i>
            <div class="btn-content">
                <span class="btn-title">تماس مستقیم</span>
                <span class="btn-sub">09028390846</span>
            </div>
        </a>
        
        <a href="https://wa.me/989028390846" class="btn">
            <i class="fa-brands fa-whatsapp"></i>
            <div class="btn-content">
                <span class="btn-title">واتساپ</span>
                <span class="btn-sub">09028390846</span>
            </div>
        </a>
    </div>

</body>
</html>
