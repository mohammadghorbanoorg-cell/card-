<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محمد قربانی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            /* فراخوانی مستقیم عکس آپلود شده شما */
            background-image: url('1786891565124.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        h1 { color: #fff; font-size: 32px; font-weight: bold; margin-bottom: 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        p { color: #e0e0e0; font-size: 17px; margin-bottom: 40px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 380px;
            padding: 18px 22px;
            margin-bottom: 20px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .btn-content { display: flex; flex-direction: column; align-items: center; flex-grow: 1; }
        .btn-title { font-size: 18px; }
        .btn-sub { font-size: 13px; opacity: 0.95; margin-top: 3px; direction: ltr; }
        .btn-insta { background: linear-gradient(90deg, #e6683c, #dc2743, #bc1888); }
        .btn-phone { background: linear-gradient(90deg, #00e676, #00c853); color: #000; }
        .btn-whatsapp { background: linear-gradient(90deg, #29b6f6, #0288d1); }
        .btn i { font-size: 28px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>محمد قربانی</h1>
        <p>مدیریت و بازرگانی</p>
        <a href="https://instagram.com/Mohammad.ghorbani_org2625" class="btn btn-insta" target="_blank">
            <i class="fa-brands fa-instagram"></i>
            <div class="btn-content">
                <span class="btn-title">اینستاگرام</span>
                <span class="btn-sub">@Mohammad.ghorbani_org2625</span>
            </div>
        </a>
        <a href="tel:09028390846" class="btn btn-phone">
            <i class="fa-solid fa-phone"></i>
            <div class="btn-content">
                <span class="btn-title">تماس مستقیم</span>
                <span class="btn-sub">09028390846</span>
            </div>
        </a>
        <a href="https://wa.me/989028390846" class="btn btn-whatsapp" target="_blank">
            <i class="fa-brands fa-whatsapp"></i>
            <div class="btn-content">
                <span class="btn-title">واتساپ</span>
                <span class="btn-sub">09028390846</span>
            </div>
        </a>
    </div>
</body>
</html>
