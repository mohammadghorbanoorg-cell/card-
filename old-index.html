<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عمو تیمور</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; background-image: radial-gradient(circle at 50% 0%, #1e2640, #0b0f19); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .card { 
            background: linear-gradient(145deg, rgba(16, 185, 129, 0.85), rgba(6, 182, 212, 0.9)); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 28px; 
            padding: 35px 25px; 
            width: 100%; 
            max-width: 360px; 
            text-align: center; 
            box-shadow: 0 25px 50px -12px rgba(6, 182, 212, 0.35); 
        }

        .profile-img { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #ffffff; object-fit: cover; margin-bottom: 15px; box-shadow: 0 0 20px rgba(255, 255, 255, 0.4); }
        h1 { color: #ffffff; font-size: 24px; font-weight: 700; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .tagline { color: #f0fdf4; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
        .quote { color: #ffffff; font-size: 13px; font-style: italic; line-height: 1.6; margin-bottom: 25px; background: rgba(0, 0, 0, 0.15); padding: 10px 15px; border-radius: 12px; border-right: 3px solid #ffffff; text-align: right; }
        
        .links-container { display: flex; flex-direction: column; gap: 12px; }
        
        /* استایل دکمه‌ها بدون خاصیت کلیک */
        .btn-box { display: flex; align-items: center; justify-content: space-between; padding: 13px 18px; border-radius: 16px; color: white; font-weight: 600; border: none; width: 100%; margin-bottom: 0; }
        
        .btn-instagram { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); text-decoration: none; }
        .btn-hashemieh { background: linear-gradient(135deg, #111827, #1f2937); border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-sajjad { background: linear-gradient(135deg, #0284c7, #0f172a); border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-khayyam { background: linear-gradient(135deg, #0f766e, #042f2e); border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-ahmadabad { background: linear-gradient(135deg, #9f1239, #4c0519); border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-owner { background: linear-gradient(135deg, #e11d48, #be123c); text-decoration: none; }
        
        .btn-content { display: flex; flex-direction: column; align-items: center; flex-grow: 1; }
        .btn-title { font-size: 14px; }
        .btn-sub { font-size: 11px; opacity: 0.85; margin-top: 2px; direction: ltr; }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://raw.githubusercontent.com/mohammadghorbanoorg-cell/card-/main/1786891565124.png" alt="عمو تیمور" class="profile-img">
        
        <h1>عمو تیمور</h1>
        <div class="tagline">غذای ایرانی،بی ادعا ولی عمیق</div>
        <div class="quote">"عموتیمور املتی نیست ، ی سبکه"</div>

        <div class="links-container">
            <!-- اینستاگرام -->
            <a href="https://instagram.com/amooteimoor" class="btn-box btn-instagram" target="_blank">
                <i class="fa-brands fa-instagram"></i>
                <div class="btn-content"><span class="btn-title">صفحه اینستاگرام</span><span class="btn-sub">@amooteimoor</span></div>
            </a>
            
            <!-- شعب (فقط نمایش) -->
            <div class="btn-box btn-hashemieh"><i class="fa-solid fa-crown"></i><div class="btn-content"><span class="btn-title">شعبه هاشمیه</span><span class="btn-sub">۰۵۱-۳۸۸۰۰۲۲۸</span></div></div>
            <div class="btn-box btn-sajjad"><i class="fa-solid fa-gem"></i><div class="btn-content"><span class="btn-title">شعبه سجاد</span><span class="btn-sub">۰۵۱-۳۶۱۱۰۰۱۱</span></div></div>
            <div class="btn-box btn-khayyam"><i class="fa-solid fa-location-dot"></i><div class="btn-content"><span class="btn-title">شعبه خیام جنوبی</span><span class="btn-sub">۰۵۱-۳۷۶۶۴۴۴۲</span></div></div>
            <div class="btn-box btn-ahmadabad"><i class="fa-solid fa-store"></i><div class="btn-content"><span class="btn-title">شعبه احمدآباد</span><span class="btn-sub">۰۵۱-۳۸۴۱۰۱۶۹</span></div></div>
            
            <!-- تماس -->
            <a href="tel:+989157500072" class="btn-box btn-owner"><i class="fa-solid fa-user-tie"></i><div class="btn-content"><span class="btn-title">تماس مستقیم با عمو</span><span class="btn-sub">۰۹۱۵ ۷۵۰ ۰۰۷۲</span></div></a>
        </div>
    </div>

</body>
</html>
