<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عمو تیمور</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; background-image: radial-gradient(circle at 50% 0%, #1e2640, #0b0f19); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .card { 
            background: rgba(21, 29, 46, 0.85); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 28px; 
            padding: 35px 25px; 
            width: 100%; 
            max-width: 360px; 
            text-align: center; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); 
        }

        .profile-img { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #d4af37; object-fit: cover; margin-bottom: 15px; box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
        h1 { color: #ffffff; font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .tagline { color: #d4af37; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
        .quote { color: #cbd5e1; font-size: 13px; font-style: italic; line-height: 1.6; margin-bottom: 25px; background: rgba(255, 255, 255, 0.03); padding: 10px 15px; border-radius: 12px; border-right: 3px solid #d4af37; text-align: right; }
        
        .links-container { display: flex; flex-direction: column; gap: 12px; }
        
        .btn-box { display: flex; align-items: center; justify-content: space-between; padding: 13px 18px; border-radius: 16px; color: white; font-weight: 600; width: 100%; text-decoration: none; margin-bottom: 0; border: none; }
        
        .btn-instagram { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
        .btn-hashemieh { background: linear-gradient(135deg, #bf953f, #aa771c); color: #000; font-weight: 700; }
        .btn-sajjad { background: linear-gradient(135deg, #059669, #022c22); border: 1px solid rgba(16, 185, 129, 0.3); }
        .btn-khayyam { background: linear-gradient(135deg, #0284c7, #0f172a); border: 1px solid rgba(56, 189, 248, 0.3); }
        .btn-ahmadabad { background: linear-gradient(135deg, #9f1239, #4c0519); border: 1px solid rgba(244, 63, 94, 0.3); }
        .btn-owner { background: linear-gradient(135deg, #e11d48, #be123c); }
        
        .btn-content { display: flex; flex-direction: column; align-items: center; flex-grow: 1; }
        .btn-title { font-size: 14px; }
        .btn-sub { font-size: 11px; opacity: 0.9; margin-top: 2px; direction: ltr; }
    </style>
</head>
<body>

    <div class="card">
        <!-- اضافه شدن عکس پروفایل -->
        <img src="https://i.ibb.co/1YC3hZBn/1786891565124.png" alt="عمو تیمور" class="profile-img">
        
        <h1>عمو تیمور</h1>
        <div class="tagline">غذای ایرانی،بی ادعا ولی عمیق</div>
        <div class="quote">"عموتیمور املتی نیست ، ی سبکه"</div>

        <div class="links-container">
            <a href="https://instagram.com/amooteimoor" class="btn-box btn-instagram" target="_blank">
                <i class="fa-brands fa-instagram"></i>
                <div class="btn-content"><span class="btn-title">صفحه اینستاگرام</span><span class="btn-sub">@amooteimoor</span></div>
            </a>
            
            <a href="tel:05138800228" class="btn-box btn-hashemieh"><i class="fa-solid fa-crown"></i><div class="btn-content"><span class="btn-title">شعبه هاشمیه</span><span class="btn-sub">۰۵۱-۳۸۸۰۰۲۲۸</span></div></a>
            <a href="tel:05136110011" class="btn-box btn-sajjad"><i class="fa-solid fa-gem"></i><div class="btn-content"><span class="btn-title">شعبه سجاد</span><span class="btn-sub">۰۵۱-۳۶۱۱۰۰۱۱</span></div></a>
            <a href="tel:05137664442" class="btn-box btn-khayyam"><i class="fa-solid fa-location-dot"></i><div class="btn-content"><span class="btn-title">شعبه خیام جنوبی</span><span class="btn-sub">۰۵۱-۳۷۶۶۴۴۴۲</span></div></a>
            <a href="tel:05138410169" class="btn-box btn-ahmadabad"><i class="fa-solid fa-store"></i><div class="btn-content"><span class="btn-title">شعبه احمدآباد</span><span class="btn-sub">۰۵۱-۳۸۴۱۰۱۶۹</span></div></a>
            
            <a href="tel:+989157500072" class="btn-box btn-owner"><i class="fa-solid fa-user-tie"></i><div class="btn-content"><span class="btn-title">تماس مستقیم با عمو</span><span class="btn-sub">۰۹۱۵ ۷۵۰ ۰۰۷۲</span></div></a>
        </div>
    </div>

</body>
</html>
